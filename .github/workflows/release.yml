name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: next
        run: |
          base=$(tr -d '[:space:]' < VERSION)
          last=$(git tag --list "v$base.*" | sed "s/^v$base\.//" | grep -E '^[0-9]+$' | sort -n | tail -1 || true)
          version="$base.$(( ${last:--1} + 1 ))"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing v$version"

  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: dotnet test --solution SmartCv.slnx

  build:
    needs: [version, test]
    strategy:
      fail-fast: true
      matrix:
        include:
          - runtime: win-x64
            os: windows-latest
          - runtime: linux-x64
            os: ubuntu-latest
          - runtime: osx-arm64
            os: macos-latest
          - runtime: osx-x64
            os: macos-latest
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      RUNTIME: ${{ matrix.runtime }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./build.ps1 -Runtime $env:RUNTIME -Version $env:VERSION

      - name: Build
        if: runner.os != 'Windows'
        run: bash ./build.sh "$RUNTIME" "$VERSION"

      - name: Package
        shell: bash
        run: |
          mkdir -p release
          name="SmartCv-$VERSION-$RUNTIME"
          case "$RUNTIME" in
            win-*) cp "publish/$RUNTIME/SmartCv.exe" "release/$name.exe" ;;
            osx-*) ditto -c -k --keepParent "publish/$RUNTIME/SmartCv.app" "release/$name.zip" ;;
            *) chmod +x "publish/$RUNTIME/SmartCv" && tar -czf "release/$name.tar.gz" -C "publish/$RUNTIME" SmartCv ;;
          esac
          ls -l release

      - uses: actions/upload-artifact@v4
        with:
          name: smartcv-${{ matrix.runtime }}
          path: release/*
          if-no-files-found: error

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "v$VERSION" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Smart CV $VERSION" \
            --generate-notes
